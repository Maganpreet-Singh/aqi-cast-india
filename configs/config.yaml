project:
  name: AQI-Cast India
  slug: aqi-cast-india
  description: AI-powered air-quality forecasting and ML engineering platform for
    Indian cities.
  timezone: Asia/Kolkata
  operating_mode: historical_replay_and_backtesting
data:
  dataset_name: Air Quality Data in India
  source_url: https://www.kaggle.com/datasets/rohanrao/air-quality-data-in-india
  approximate_coverage: 2015-2020
  target_column: AQI
  city_column: City
  date_column: Date
forecasting:
  target: AQI
  horizons_days:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  evaluation_split: chronological
  backtesting: rolling_origin
modeling:
  primary_model: LightGBMRegressor
  baseline_models:
  - persistence
  - historical_mean_or_seasonal_climatology
  random_seed: 42
  metrics:
  - MAE
  - RMSE
  - R2
reproducibility:
  random_seed: 42
  record_package_versions: true
  avoid_random_train_test_split: true
paths:
  raw_data: data/raw
  processed_data: data/processed
  features: data/features
  sample_data: data/sample
  models: models
  experiments: experiments
  artifacts: artifacts
  images: images
  reports: reports
  logs: logs
runtime:
  preferred_training_device: cpu
  gpu_optional: true
  print_filesystem_paths: false

